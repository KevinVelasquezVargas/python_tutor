summary = "Aprendizagem de Python com NVDA"
description = """Desbloqueia o poder da programação: aprende Python desde o zero com lições guiadas por voz e desenvolve os teus próprios projetos num editor desenhado exclusivamente para a acessibilidade com NVDA."""
changelog = """Registo de alterações versão 3.1.0:
- Sistema de catálogos de lições em JSON: adicionar um idioma novo é tão simples como acrescentar locale/<idioma>/lessons.json e recompilar; o idioma aparece automaticamente nas preferências e na deteção do idioma do NVDA.
- Português (PT-PT) oficial completo: os 40 capítulos (190 lições), interface, menus e localização gettext na íntegra.
- Reserva parcial capítulo a capítulo: o que não estiver traduzido é mostrado em espanhol.
- Seletor de idioma dinâmico baseado nos catálogos disponíveis (normaliza variantes como pt_BR ou en_US).
Registo de alterações versão 3.0.1:
- Desbloqueio total entre capítulos: navegação e acesso direto a qualquer lição do curso, mantendo a avaliação estruturada por fases dentro de cada capítulo.
- Correção crítica no validador e executor do Capítulo 17 (Passo 3) para permitir o avanço fluido em desafios com a consola em silêncio.
- Harmonização e tolerância bilingue nas consignas e verificadores dos 40 capítulos.
- Plano formativo integral de 40 capítulos (190 lições) com metodologia pedagógica Conceitos Primeiro.
- Dualidade operativa: alternância fluida entre o Modo Tutor guiado e o Modo Editor autónomo (Control + M).
- Interface adaptativa: ocultação contextual do editor em lições teóricas e seletor acessível de questionários (wx.RadioBox).
- Seletor de capítulos com navegação flexível e desbloqueio de acesso direto.
- Localização bilingue oficial em espanhol e inglês (Learning Python with NVDA).
- Assistente explicativo local offline (F1) e integração opcional com a Google Gemini API (Control + Shift + I).
- Independência técnica total: baseado 100% na biblioteca padrão do Python (sqlite3, json, math, random).
- Persistência robusta do utilizador no perfil de configuração do NVDA, protegida contra atualizações.
- Compatibilidade certificada desde o NVDA 2022.1.0 até ao 2026.2.0."""
