name: build addon

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
  workflow_call:

jobs:
  build:
    if: github.repository != 'nvaccess/addonTemplate'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gettext
        uv sync

    - name: Code checks
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files || true

    - name: building addon
      run: |
        uv run scons

    - uses: actions/upload-artifact@v4
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon

