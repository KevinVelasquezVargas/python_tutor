summary = "Learning Python with NVDA"
description = """Unlock the power of programming: learn Python from scratch with voice-guided lessons and build your own projects in an editor designed exclusively for accessibility with NVDA."""
changelog = """Version 3.1.0 changelog:
- JSON lesson catalog system: adding a new language is as simple as adding locale/<language>/lessons.json and rebuilding; the language then appears automatically in preferences and in NVDA language detection.
- Complete official Portuguese (PT-PT): all 40 chapters (190 lessons), interface, menus and full gettext localization.
- Chapter-by-chapter partial fallback: anything not translated is shown in Spanish.
- Dynamic language selector based on the available catalogs (it normalizes variants such as pt_BR or en_US).
Version 3.0.1 changelog:
- Full inter-chapter unlocking: navigate directly to any lesson in the course while keeping the phase-based assessment inside each chapter.
- Critical fix in the Chapter 17 validator and runner (Step 3), allowing smooth progress in challenges with a silent console.
- Bilingual harmonization and tolerance in the instructions and validators of all 40 chapters.
- Comprehensive 40-chapter syllabus (190 lessons) following the Concepts First teaching methodology.
- Operating duality: smooth switching between the guided Tutor mode and the standalone Editor mode (Control + M).
- Adaptive interface: contextual hiding of the editor in theory lessons and an accessible quiz picker (wx.RadioBox).
- Chapter selector with flexible navigation and direct-access unlocking.
- Official bilingual localization in Spanish and English (Learning Python with NVDA).
- Offline local explainer assistant (F1) and optional Google Gemini API integration (Control + Shift + I).
- Total technical independence: built 100% on the Python standard library (sqlite3, json, math, random).
- Robust user persistence in the NVDA configuration profile, protected against updates.
- Certified compatibility from NVDA 2022.1.0 to 2026.2.0."""
